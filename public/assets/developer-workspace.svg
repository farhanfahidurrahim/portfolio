<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bfa6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfc2"/>
      <stop offset="100%" stop-color="#00bfa6"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Background Glow -->
  <circle cx="300" cy="270" r="220" fill="#00bfa6" fill-opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="240" cy="220" r="160" fill="#0284c7" fill-opacity="0.06"/>

  <!-- Orbiting Lines -->
  <ellipse cx="300" cy="300" rx="270" ry="120" stroke="#00bfa6" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 8"/>
  <ellipse cx="300" cy="300" rx="230" ry="90" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Desk Surface -->
  <polygon points="60,430 540,430 490,470 110,470" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="430" x2="520" y2="430" stroke="#00bfa6" stroke-width="3" stroke-opacity="0.8" filter="url(#softGlow)"/>

  <!-- Main Monitor Stand & Base -->
  <polygon points="275,410 325,410 335,430 265,430" fill="#334155"/>
  <rect x="292" y="320" width="16" height="90" rx="3" fill="#475569"/>

  <!-- Main Central Curved Display -->
  <rect x="150" y="140" width="300" height="190" rx="14" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#softGlow)"/>
  
  <!-- Monitor Header -->
  <rect x="150" y="140" width="300" height="26" rx="14" fill="#090d16"/>
  <circle cx="168" cy="153" r="4" fill="#ef4444"/>
  <circle cx="182" cy="153" r="4" fill="#f59e0b"/>
  <circle cx="196" cy="153" r="4" fill="#10b981"/>
  <text x="215" y="157" fill="#94a3b8" font-family="monospace" font-size="10">AppController.php</text>

  <!-- IDE Code on Main Display -->
  <text x="170" y="186" fill="#c084fc" font-family="monospace" font-size="11">class</text>
  <text x="210" y="186" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="11">SoftwareDeveloper</text>
  <text x="340" y="186" fill="#e2e8f0" font-family="monospace" font-size="11">{</text>
  
  <text x="185" y="208" fill="#64748b" font-family="monospace" font-size="10">// Enterprise Core</text>
  <text x="185" y="226" fill="#f43f5e" font-family="monospace" font-size="10">public</text>
  <text x="230" y="226" fill="#00dfc2" font-family="monospace" font-size="10">$framework</text>
  <text x="300" y="226" fill="#e2e8f0" font-family="monospace" font-size="10">=</text>
  <text x="315" y="226" fill="#fbbf24" font-family="monospace" font-size="10">'Laravel'</text>
  <text x="375" y="226" fill="#e2e8f0" font-family="monospace" font-size="10">;</text>

  <text x="185" y="246" fill="#f43f5e" font-family="monospace" font-size="10">public</text>
  <text x="230" y="246" fill="#00dfc2" font-family="monospace" font-size="10">$frontend</text>
  <text x="295" y="246" fill="#e2e8f0" font-family="monospace" font-size="10">=</text>
  <text x="310" y="246" fill="#fbbf24" font-family="monospace" font-size="10">'React.js'</text>
  <text x="370" y="246" fill="#e2e8f0" font-family="monospace" font-size="10">;</text>

  <text x="185" y="266" fill="#f43f5e" font-family="monospace" font-size="10">public</text>
  <text x="230" y="266" fill="#00dfc2" font-family="monospace" font-size="10">$database</text>
  <text x="295" y="266" fill="#e2e8f0" font-family="monospace" font-size="10">=</text>
  <text x="310" y="266" fill="#fbbf24" font-family="monospace" font-size="10">'MySQL'</text>
  <text x="355" y="266" fill="#e2e8f0" font-family="monospace" font-size="10">;</text>

  <!-- Animated Green Pulse on Main Screen -->
  <rect x="185" y="284" width="70" height="18" rx="4" fill="#00bfa6" fill-opacity="0.15" stroke="#00bfa6" stroke-width="1"/>
  <text x="195" y="296" fill="#00dfc2" font-family="monospace" font-size="9" font-weight="bold">● API: 200 OK</text>
  
  <rect x="265" y="284" width="95" height="18" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="273" y="296" fill="#38bdf8" font-family="monospace" font-size="9">✓ Build: Clean</text>

  <!-- Left Secondary Screen (Vertical) -->
  <polygon points="75,170 135,185 135,330 75,310" fill="#0b1120" stroke="#00bfa6" stroke-width="1.8"/>
  <line x1="85" y1="200" x2="125" y2="208" stroke="#00bfa6" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="85" y1="215" x2="115" y2="221" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="85" y1="230" x2="120" y2="237" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="85" y1="245" x2="110" y2="251" stroke="#00bfa6" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="85" y1="260" x2="125" y2="267" stroke="#a855f7" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="85" y1="275" x2="105" y2="280" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Right Secondary Screen (Analytics / Database) -->
  <polygon points="465,185 525,170 525,310 465,330" fill="#0b1120" stroke="#06b6d4" stroke-width="1.8"/>
  <line x1="475" y1="208" x2="515" y2="200" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="475" y1="221" x2="505" y2="215" stroke="#10b981" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="475" y1="237" x2="510" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="495" cy="270" r="14" fill="none" stroke="#00bfa6" stroke-width="3" stroke-dasharray="40 20"/>

  <!-- Laptop on Desk Center -->
  <polygon points="230,415 370,415 390,435 210,435" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="275" y="423" width="50" height="7" rx="2" fill="#334155"/>
  <rect x="235" y="355" width="130" height="60" rx="4" fill="#0f172a" stroke="#00bfa6" stroke-width="1.5"/>
  <line x1="245" y1="375" x2="310" y2="375" stroke="#00dfc2" stroke-width="2"/>
  <line x1="245" y1="388" x2="285" y2="388" stroke="#38bdf8" stroke-width="2"/>

  <!-- Coffee Mug & Plant on Desk -->
  <rect x="420" y="395" width="22" height="26" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <path d="M442,402 C448,402 448,414 442,414" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  
  <rect x="145" y="405" width="22" height="20" rx="3" fill="#334155"/>
  <path d="M156,405 C150,390 142,392 144,385 C152,385 156,395 156,405" fill="#10b981"/>
  <path d="M156,405 C162,390 170,392 168,385 C160,385 156,395 156,405" fill="#00bfa6"/>

  <!-- Floating Hologram Badges -->
  <!-- Laravel Badge -->
  <g transform="translate(110, 80)">
    <rect width="90" height="34" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="14" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Laravel</text>
    <circle cx="74" cy="17" r="4" fill="#f43f5e"/>
  </g>

  <!-- React / Next Badge -->
  <g transform="translate(390, 75)">
    <rect width="105" height="34" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="14" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">React/Next</text>
    <circle cx="89" cy="17" r="4" fill="#38bdf8"/>
  </g>

  <!-- REST API Badge -->
  <g transform="translate(440, 360)">
    <rect width="95" height="32" rx="10" fill="#0f172a" stroke="#00bfa6" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="14" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">REST APIs</text>
    <circle cx="80" cy="16" r="4" fill="#00dfc2"/>
  </g>

  <!-- MySQL Badge -->
  <g transform="translate(60, 350)">
    <rect width="90" height="32" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="14" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">MySQL</text>
    <circle cx="74" cy="16" r="4" fill="#f59e0b"/>
  </g>
</svg>
